<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This is Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Merienda&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="
https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js
"></script>
    <link
      href="
https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css
"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="navbar"></div>
    <script>
      // Load the navbar.html file into the div with id="navbar"
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>
    <h1>Ultra Bungee Gallery</h1>
    <article class="article1">
      <h4>Get an idea of the thrill of Ultra Bungee</h4>
      <a data-fancybox="gallery" href="img/bridge2.jpg"
        ><img src="img/bridge2_thumb.jpg"
      /></a>
    </article>
    <article class="article2">
      <div class="article-block">
        <h3>Ultra Bungee is New Zealand's largest bungee operator</h3>
        <a href="mailto:admin@ultrabungee.nz" class="button">Contact</a>
        <a href="index.html" class="button">Home</a>
      </div>
    </article>
  </body>
</html>
