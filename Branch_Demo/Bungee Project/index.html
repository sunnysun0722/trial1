<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thisi is a Demo</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Merienda&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="navbar"></div>
    <script>
      // Load the navbar.html file into the div with id="navbar"
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
    </script>
    <section id="intro">
      <div class="intro-block">
        <h1>Feel the fall with Ultra Bungee</h1>
        <a href="bridge.html" class="button">Bridge Jump</a>
        <a href="canyon.html" class="button">Canyon Jump</a>
        <a href="tower.html" class="button">Tower Jump</a>
      </div>
    </section>
  </body>
</html>
